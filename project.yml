name: Pixport
options:
  bundleIdPrefix: pl.froncek
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: FL9F23BAR9
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  PixportKit:
    path: Packages/PixportKit

targets:
  Pixport:
    type: application
    platform: iOS
    sources:
      - path: Pixport
    dependencies:
      - package: PixportKit
      - target: PixportShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.froncek.pixport
        INFOPLIST_FILE: Pixport/Info.plist
        CODE_SIGN_ENTITLEMENTS: Pixport/Pixport.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        # Polski jest językiem źródłowym projektu; angielski to pełnoprawne tłumaczenie.
        SWIFT_EMIT_LOC_STRINGS: YES

  PixportShare:
    type: app-extension
    platform: iOS
    sources:
      - path: PixportShare
      # Rozszerzenie dostaje tylko te pliki aplikacji, które nie sięgają po
      # UIApplication.shared ani po bibliotekę zdjęć — jedno jest w rozszerzeniach
      # niedostępne, drugie zbędne.
      - path: Pixport/Shared/Localization.swift
      - path: Pixport/Shared/ErrorPresentation.swift
      - path: Pixport/Shared/ShareSheet.swift
      - path: Pixport/Features/Settings/SettingsStore.swift
      - path: Pixport/Resources/Localizable.xcstrings
    dependencies:
      - package: PixportKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.froncek.pixport.share
        INFOPLIST_FILE: PixportShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: PixportShare/PixportShare.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
